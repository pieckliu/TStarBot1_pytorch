name: core-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validated core and test dependencies
        run: >-
          python -m pip install -e ".[test]"
          -c requirements/constraints-py311.txt
      - name: Run framework-independent tests
        run: python -m pytest -m "not sc2"
